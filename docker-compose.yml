services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://portfolio:password@postgres:5432/portfolio}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      EVO_API_URL: ${EVO_API_URL:-https://evolution.example.com}
      EVO_INSTANCE: ${EVO_INSTANCE:-your-instance}
      EVO_API_KEY: ${EVO_API_KEY:-}
      EVO_NOTIFY_NUMBER: ${EVO_NOTIFY_NUMBER:-000000000000}
    volumes:
      - uploads:/srv/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: .
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      HOST: 0.0.0.0
      PORT: 4321
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  uploads:
