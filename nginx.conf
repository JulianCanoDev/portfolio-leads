server {
  listen 80;
  server_name _;

  # ---------- IP real del cliente (detrás del Traefik de Dokploy) ----------
  # Sin esto, $remote_addr es 10.0.1.9 (contenedor Traefik) y `deny` no matchea.
  set_real_ip_from 10.0.1.0/24;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ---------- Deny list ----------
  # 173.255.175.69 (Latitude.sh MX): flood de /api/contact + brute-force de login, 11/Nov/2026
  deny 173.255.175.69;

  charset utf-8;
  server_tokens off;
  client_max_body_size 2m;

  # ---------- Gzip ----------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ---------- Security headers ----------
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ---------- Uploaded images (served by the backend) ----------
  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=604800";
  }

  # ---------- API → FastAPI ----------
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---------- Everything else → Astro SSR ----------
  location / {
    proxy_pass http://frontend:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Hidden files are never served
  location ~ /\. {
    deny all;
  }
}
